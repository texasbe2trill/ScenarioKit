version: 1
build: dev
scenario:
  name: Suspicious PowerShell + Outbound Connection
  description: Encoded PowerShell execution followed by outbound network activity.
  owner: community
  tags: [windows, powershell, execution]
severity: high
signals:
  - id: win_scriptblock
    label: Windows Script Block Logging (Event ID 4104)
  - id: proc_create
    label: Process creation telemetry (command line, parent image)
  - id: net_conn
    label: Network connection telemetry (destination, port, time)
rules:
  - id: RULE-PS-ENC
    title: Encoded PowerShell execution
    severity: high
    techniques: ["T1059.001"]
    match:
      - ok: true
        text: event.CommandLine contains -enc
      - ok: true
        text: event.ParentImage not_contains IntuneManagementExtension
    explanation: Encoded PowerShell can obscure intent and is frequently associated with suspicious activity.
actions:
  - id: ACT-TRIAGE
    title: Initial triage
    steps:
      - Collect process tree and command-line history
      - Capture network connections near timestamp
      - Review user sign-in context
    notes: Keep steps minimal and safe; provide optional references separately.
timeline:
  - time: "09:41:12"
    headline: PowerShell execution observed
    detail: Rule RULE-PS-ENC matched due to -enc in CommandLine.
    severity: high
  - time: "09:41:35"
    headline: Outbound network connection observed
    detail: Investigate destination, timing, and repetition patterns.
    severity: medium
fixtures:
  - id: F1
    expected: ["RULE-PS-ENC"]
    result: pass
    event:
      CommandLine: "powershell -enc aQBlAHgA..."
      ParentImage: "explorer.exe"
      User: "jdoe"
      DeviceName: "WIN-LAPTOP-01"
