title: macOS DNS Lookup Activity
id: MACOS_DNS_Resolver
status: experimental
description: Detects DNS resolver activity in Unified Logs
tags:
  - attack.discovery
  - attack.t1018          # Remote System Discovery
  - attack.command_and_control
  - attack.t1071.004      # Application Layer Protocol: DNS
logsource:
  product: macos
detection:
  selection:
    category|contains: dns
  selection2:
    subsystem|contains: dns
  selection3:
    eventMessage|contains:
      - resolver
      - dns
      - query
      - "A record"
      - "AAAA record"
  selection4:
    composedMessage|contains: dns
  condition: selection3 or selection4 or (selection and selection2)

