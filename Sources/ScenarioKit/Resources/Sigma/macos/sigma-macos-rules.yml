---
title: macOS Command HTTP Fetch
id: MACOS_Command_HTTP_Fetch
status: experimental
description: Detects curl/wget style HTTP fetches with explicit URL indicators
tags:
  - attack.command_and_control
  - attack.t1071.001  # Application Layer Protocol: Web Protocols
  - attack.t1105      # Ingress Tool Transfer
logsource:
  product: macos
detection:
  proc:
    process|contains:
      - curl
      - wget
      - "sh -c curl"
  url:
    eventMessage|contains:
      - http
      - https
      - "http://"
      - "https://"
      - " -o "
      - " -O "
      - connect
  composed:
    composedMessage|contains: http
  sender:
    senderImagePath|contains:
      - curl
      - wget
  condition: proc and url
---
title: macOS TCC Prompt Activity
id: MACOS_TCC_Prompt
status: experimental
description: Detects macOS Transparency, Consent, and Control (TCC) prompts
tags:
  - attack.privilege_escalation
  - attack.t1548          # Abuse Elevation Control Mechanism
  - attack.defense_evasion
  - attack.t1562.001      # Impair Defenses: Disable or Modify Tools
logsource:
  product: macos
detection:
  selection:
    subsystem|contains: com.apple.tcc
  selection2:
    eventMessage|contains:
      - tcc
      - kTCCService
      - "access was denied"
      - "privacy prompt"
  condition: selection or selection2
---
title: macOS LaunchAgent Persistence Artifact
id: MACOS_LaunchAgent_Write
status: experimental
description: Detects LaunchAgent/LaunchDaemon artifacts in messages
tags:
  - attack.persistence
  - attack.t1543.001      # Create or Modify System Process: Launch Agent
  - attack.t1543.004      # Create or Modify System Process: Launch Daemon
logsource:
  product: macos
detection:
  selection:
    eventMessage|contains:
      - launchagent
      - launchdaemon
      - "/LaunchAgents"
      - "/LaunchDaemons"
      - ".plist"
  selection2:
    composedMessage|contains:
      - launchagent
      - launchdaemon
      - ".plist"
  selection3:
    path|contains:
      - "~/Library/LaunchAgents"
      - "/Library/LaunchAgents"
      - "/Library/LaunchDaemons"
  condition: selection or selection2 or selection3

