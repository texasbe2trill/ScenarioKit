---
title: macOS Command HTTP Fetch
id: MACOS_Command_HTTP_Fetch
status: experimental
description: Detects curl/wget style HTTP fetches with explicit URL indicators
logsource:
  product: macos
detection:
  proc:
    process|contains:
      - curl
      - wget
      - "sh -c curl"
  url:
    eventMessage|contains:
      - http
      - https
      - "http://"
      - "https://"
      - " -o "
      - " -O "
      - connect
  composed:
    composedMessage|contains: http
  sender:
    senderImagePath|contains:
      - curl
      - wget
  condition: proc and url
---
title: macOS TCC Prompt Activity
id: MACOS_TCC_Prompt
status: experimental
description: Detects macOS Transparency, Consent, and Control (TCC) prompts
logsource:
  product: macos
detection:
  selection:
    subsystem|contains: com.apple.tcc
  selection2:
    eventMessage|contains:
      - tcc
      - kTCCService
      - "access was denied"
      - "privacy prompt"
  condition: selection or selection2
---
title: macOS LaunchAgent Persistence Artifact
id: MACOS_LaunchAgent_Write
status: experimental
description: Detects LaunchAgent/LaunchDaemon artifacts in messages
logsource:
  product: macos
detection:
  selection:
    eventMessage|contains:
      - launchagent
      - launchdaemon
      - "/LaunchAgents"
      - "/LaunchDaemons"
      - ".plist"
  selection2:
    composedMessage|contains:
      - launchagent
      - launchdaemon
      - ".plist"
  selection3:
    path|contains:
      - "~/Library/LaunchAgents"
      - "/Library/LaunchAgents"
      - "/Library/LaunchDaemons"
  condition: selection or selection2 or selection3

---
title: macOS DNS Lookup Activity
id: MACOS_DNS_Resolver
status: experimental
description: Detects DNS resolver activity in Unified Logs
logsource:
  product: macos
detection:
  selection:
    category|contains: dns
  selection2:
    subsystem|contains: dns
  selection3:
    eventMessage|contains:
      - resolver
      - dns
      - query
      - "A record"
      - "AAAA record"
  selection4:
    composedMessage|contains: dns
  condition: selection3 or selection4 or (selection and selection2)

---
title: macOS Plist Write or Persistence Artifact
id: MACOS_Plist_Write
status: experimental
description: Detects .plist writes or persistence indicators in Unified Logs
logsource:
  product: macos
detection:
  selection:
    eventMessage|contains:
      - .plist
      - launchagent
      - launchdaemon
      - loginitem
  selection2:
    composedMessage|contains: .plist
  selection3:
    path|contains: .plist
  condition: selection or selection2 or selection3

---
title: macOS Syspolicy or XProtect Block
id: MACOS_Syspolicy_Block
status: experimental
description: Detects Gatekeeper, syspolicyd, or XProtect blocks/alerts
logsource:
  product: macos
detection:
  selection:
    eventMessage|contains:
      - syspolicyd
      - gatekeeper
      - quarantine
      - xprotect
      - malware
  condition: selection
